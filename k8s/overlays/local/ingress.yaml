apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-frontend-ingress
  namespace: omnipulse-local
  annotations:
    ingress.class: "nginx"
spec:
  rules:
  - host: boutique.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

