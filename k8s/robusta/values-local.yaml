# Local Minikube Helm Values for Robusta OSS
clusterName: "omnipulse-local"
isSmallCluster: true

runner:
  sendAdditionalTelemetry: false
  serviceAccount:
    create: true
    name: "robusta-runner-service-account"
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

rbac:
  create: true

globalConfig:
  cluster_name: "omnipulse-local"
  signing_key: "robusta-oss-local"
  account_id: "operational-intelligence-local"
  aiops_provider: "local"
  dynamodb_audit_table: "omnipulse_audit_local"
  prometheus_url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  alertmanager_url: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093"

sinksConfig:
  - stdout_sink:
      name: stdout_logging

customPlaybooks:
  # Autonomous Self-Healing for CrashLoopBackOff Workloads
  - triggers:
      - on_pod_crash_loop:
          namespace_prefix: "omnipulse-"
          rate_limit: 300
    actions:
      - restart_loop_reporter: {}
      - rollout_restart: {}

  # Failure Mode 1: Deadlocked / Stalled Consumer (emailservice)
  - triggers:
      - on_prometheus_alert:
          alert_name: "ConsumerTriageStalled"
      - on_prometheus_alert:
          alert_name: "OldestUnackedMessageAgeHigh"
    actions:
      - robusta_playbooks.stalled_consumer_playbook:
          target_deployment: "emailservice"
          target_namespace: "omnipulse-local"
          max_stalled_seconds: 120
          auto_restart_safe: true

  # Failure Mode 2: SQS DLQ Backpressure & Poison Pills
  - triggers:
      - on_prometheus_alert:
          alert_name: "PubSubDLQBackpressure"
      - on_prometheus_alert:
          alert_name: "DeadLetterQueueSurge"
    actions:
      - robusta_playbooks.dlq_poison_pill_playbook:
          target_subscription: "consumer-triage-dlq"
          quarantine_bucket: "s3://omnipulse-quarantine-local"
          backoff_cooldown_seconds: 60

  # Failure Mode 3: LLM / Bedrock API Quota Backoff
  - triggers:
      - on_prometheus_alert:
          alert_name: "VertexAIQuotaExhausted"
      - on_prometheus_alert:
          alert_name: "RateLimit429Surge"
    actions:
      - robusta_playbooks.vertex_quota_backoff_playbook:
          target_deployment: "paymentservice"
          target_namespace: "omnipulse-local"
          cooldown_window_seconds: 180
          scale_down_step: 1

  # Failure Mode 4: Storefront HTTP 5xx Outage Surge Auto-Remediation
  - triggers:
      - on_prometheus_alert:
          alert_name: "FrontendHTTP5xxRateHigh"
    actions:
      - rollout_restart: {}

  # Failure Mode 5: Proactive Memory Saturation Prevention (Pre-OOMKill)
  - triggers:
      - on_prometheus_alert:
          alert_name: "ContainerMemoryNearLimit"
    actions:
      - rollout_restart: {}

  # Failure Mode 6: Proactive CPU Saturation Remediation
  - triggers:
      - on_prometheus_alert:
          alert_name: "ContainerCPUNearLimit"
    actions:
      - rollout_restart: {}

