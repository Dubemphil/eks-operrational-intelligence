name: AWS EKS Infrastructure (Terraform)
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('{0} [{1}] by @{2}', inputs.action == 'destroy' && '💥 DESTROY' || '🚀 APPLY', inputs.environment, github.actor) || format('🚀 Auto-Apply [dev] - {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy-infrastructure.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - prod
      action:
        description: 'Terraform Action'
        required: true
        type: choice
        default: 'apply'
        options:
          - apply
          - destroy

permissions:
  id-token: write   # Required for AWS keyless OIDC authentication
  contents: read

jobs:
  validate:
    name: 🧪 Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/robusta-playbooks/requirements.txt || true

      - name: Run AIOps Diagnostic Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Validate Kustomize Overlays
        run: |
          kubectl kustomize k8s/overlays/local > /dev/null
          kubectl kustomize k8s/overlays/aws-dev > /dev/null
          kubectl kustomize k8s/overlays/aws-prod > /dev/null
          echo "✅ All Kustomize overlays (local, aws-dev, aws-prod) compiled successfully"

  terraform-apply:
    name: ${{ (inputs.action == 'destroy' && '💥 Terraform Destroy') || '🏗️ Terraform Apply' }} (${{ inputs.environment || 'dev' }})
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ inputs.environment || 'dev' }}
      cluster_name: ${{ steps.tf-outputs.outputs.cluster_name }}
      alb_role_arn: ${{ steps.tf-outputs.outputs.alb_role_arn }}
      vpc_id: ${{ steps.tf-outputs.outputs.vpc_id }}
      robusta_role_arn: ${{ steps.tf-outputs.outputs.robusta_role_arn }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}
          role-session-name: GitHubActions-Terraform-${{ inputs.action == 'destroy' && 'Destroy' || 'Apply' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/aws

      - name: Terraform Init & Apply / Destroy
        working-directory: terraform/aws/environments/${{ inputs.environment || 'dev' }}
        run: |
          TARGET_ENV="${{ inputs.environment || 'dev' }}"
          ACTION="${{ inputs.action || 'apply' }}"
          echo "Executing Terraform action [$ACTION] for environment: $TARGET_ENV"
          INIT_ARGS=(
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
            -backend-config="key=environments/${TARGET_ENV}/terraform.tfstate"
            -backend-config="region=${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}"
          )
          if [ -n "${{ secrets.TF_LOCK_TABLE }}" ]; then
            INIT_ARGS+=(-backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}")
          fi
          terraform init "${INIT_ARGS[@]}"
          
          if [ "$ACTION" = "destroy" ]; then
            echo "⚠️ INITIATING INFRASTRUCTURE DESTRUCTION FOR: $TARGET_ENV"
            terraform destroy -auto-approve
          else
            echo "🚀 APPLYING INFRASTRUCTURE FOR: $TARGET_ENV"
            terraform apply -auto-approve
          fi

      - name: Export Terraform Outputs
        id: tf-outputs
        if: (inputs.action || 'apply') == 'apply'
        working-directory: terraform/aws/environments/${{ inputs.environment || 'dev' }}
        run: |
          echo "cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "alb_role_arn=$(terraform output -raw aws_load_balancer_controller_role_arn)" >> $GITHUB_OUTPUT
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "robusta_role_arn=$(terraform output -raw robusta_runner_role_arn)" >> $GITHUB_OUTPUT

  trigger-platform:
    name: 🚀 Trigger Platform & Dashboards
    needs: terraform-apply
    if: (inputs.action || 'apply') == 'apply'
    uses: ./.github/workflows/deploy-platform.yaml
    with:
      environment: ${{ needs.terraform-apply.outputs.target_env }}
      cluster_name: ${{ needs.terraform-apply.outputs.cluster_name }}
      alb_role_arn: ${{ needs.terraform-apply.outputs.alb_role_arn }}
      vpc_id: ${{ needs.terraform-apply.outputs.vpc_id }}
      robusta_role_arn: ${{ needs.terraform-apply.outputs.robusta_role_arn }}
    secrets: inherit
