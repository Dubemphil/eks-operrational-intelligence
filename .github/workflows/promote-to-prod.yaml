name: Promote Dev to Production
run-name: 🚀 Promote Dev to Production by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target_image:
        description: 'Specific image digest/tag to promote (leave blank to auto-promote current dev version)'
        required: false
        default: ''
        type: string
      confirm:
        description: 'Confirm promotion to Production environment'
        required: true
        type: boolean
        default: true

permissions:
  contents: write # Required to commit and push changes to gitops/prod

jobs:
  promote:
    name: 🚀 Promote Dev to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Resolve Previous Production Image
        id: prev-prod
        run: |
          PREV_IMAGE=$(python3 -c "import re; content=open('gitops/prod/kustomization.yaml').read(); m_n=re.search(r'newName:\s*([^\s]+)', content); m_d=re.search(r'digest:\s*([^\s]+)', content); m_t=re.search(r'newTag:\s*([^\s]+)', content); n=m_n.group(1) if m_n else ''; d=m_d.group(1) if m_d else ''; t=m_t.group(1) if m_t else ''; print(f'{n}@{d}' if d else (f'{n}:{t}' if t else n))")
          echo "Current Production Image: $PREV_IMAGE"
          echo "prev_image=$PREV_IMAGE" >> $GITHUB_OUTPUT

      - name: Resolve Target Image Reference
        id: resolve
        run: |
          USER_INPUT="${{ github.event.inputs.target_image }}"
          if [ -n "$USER_INPUT" ]; then
            echo "Using user-specified image: $USER_INPUT"
            echo "image=$USER_INPUT" >> $GITHUB_OUTPUT
          else
            echo "Detecting current image from gitops/dev/kustomization.yaml..."
            DEV_IMAGE=$(python3 -c "import re; content=open('gitops/dev/kustomization.yaml').read(); m_n=re.search(r'newName:\s*([^\s]+)', content); m_d=re.search(r'digest:\s*([^\s]+)', content); m_t=re.search(r'newTag:\s*([^\s]+)', content); n=m_n.group(1) if m_n else ''; d=m_d.group(1) if m_d else ''; t=m_t.group(1) if m_t else ''; print(f'{n}@{d}' if d else (f'{n}:{t}' if t else n))")
            if [ -z "$DEV_IMAGE" ]; then
              echo "❌ Error: Could not determine image from gitops/dev"
              exit 1
            fi
            echo "Detected Dev Image: $DEV_IMAGE"
            echo "image=$DEV_IMAGE" >> $GITHUB_OUTPUT
          fi

      - name: Update Production GitOps Manifest
        run: |
          TARGET="${{ steps.resolve.outputs.image }}"
          echo "Promoting image to Production: $TARGET"
          
          cd gitops/prod
          kustomize edit set image app="$TARGET"
          cd ../..

          echo "Diff in gitops/prod/kustomization.yaml:"
          git diff gitops/prod/kustomization.yaml

      - name: Commit and Push to GitOps
        id: git-push
        run: |
          TARGET="${{ steps.resolve.outputs.image }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet gitops/prod/kustomization.yaml; then
            echo "ℹ️ No changes detected. Production is already up to date with Dev."
            echo "status=unchanged" >> $GITHUB_OUTPUT
          else
            git commit -am "chore(gitops): promote dev image to prod ($TARGET) [skip ci]"
            git push
            COMMIT_SHA=$(git rev-parse --short HEAD)
            echo "status=promoted" >> $GITHUB_OUTPUT
            echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "✅ Successfully promoted $TARGET to production (commit $COMMIT_SHA)!"
          fi

      - name: Generate Enterprise Promotion Summary
        if: always()
        run: |
          TARGET="${{ steps.resolve.outputs.image }}"
          PREV="${{ steps.prev-prod.outputs.prev_image }}"
          STATUS="${{ steps.git-push.outputs.status || 'failed' }}"
          COMMIT="${{ steps.git-push.outputs.commit_sha || 'N/A' }}"

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 OmniPulse Production Promotion Summary

          | Attribute | Details |
          |:---|:---|
          | **Triggered By** | @${{ github.actor }} |
          | **Promotion Status** | **${STATUS}** |
          | **Target Image** | \`${TARGET}\` |
          | **Previous Production Image** | \`${PREV}\` |
          | **GitOps Commit** | \`${COMMIT}\` |

          ---

          ### 🔄 Next Steps in Argo CD
          1. Argo CD watches \`gitops/prod/kustomization.yaml\` and will automatically sync the new image digest to the **prod** environment.
          2. Check the live deployment in the Argo CD UI:
             - **App Name**: \`omnipulse-prod\`
             - **Namespace**: \`omnipulse-aws-prod\`
          EOF
