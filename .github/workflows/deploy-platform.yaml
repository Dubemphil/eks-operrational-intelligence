name: Deploy Platform & Dashboards
run-name: 🚀 Deploy Platform [${{ inputs.environment || 'dev' }}] by @${{ github.actor }}

on:
  push:
    branches: [ "main" ]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-platform.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - prod
      clean_webhooks:
        description: 'Force regenerate webhook TLS certificates'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        default: 'dev'
      cluster_name:
        required: false
        type: string
        default: ''
      alb_role_arn:
        required: false
        type: string
        default: ''
      vpc_id:
        required: false
        type: string
        default: ''
      robusta_role_arn:
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy-platform:
    name: 🚀 Platform & Dashboards (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Platform-Deploy

      - name: Setup Kubectl & Helm
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Discover EKS Cluster & Context
        id: cluster-info
        run: |
          CLUSTER="${{ inputs.cluster_name }}"
          if [ -z "$CLUSTER" ]; then
            echo "Auto-discovering EKS cluster for environment: $TARGET_ENV..."
            CLUSTER=$(aws eks list-clusters --region "$AWS_REGION" --query "clusters[?contains(@, '${TARGET_ENV}')] | [0]" --output text)
            if [ "$CLUSTER" = "None" ] || [ -z "$CLUSTER" ]; then
              CLUSTER="omnipulse-eks-${TARGET_ENV}"
            fi
          fi
          echo "Connecting to EKS Cluster: $CLUSTER in $AWS_REGION..."
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          kubectl get nodes
          
          # Discover Account ID & VPC ID dynamically
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          VPC_ID="${{ inputs.vpc_id }}"
          if [ -z "$VPC_ID" ]; then
            VPC_ID=$(aws eks describe-cluster --name "$CLUSTER" --query "cluster.resourcesVpcConfig.vpcId" --output text)
          fi
          
          ALB_ROLE="${{ inputs.alb_role_arn }}"
          if [ -z "$ALB_ROLE" ]; then
            ALB_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/omnipulse-aws-load-balancer-controller-${TARGET_ENV}"
          fi
          
          ROBUSTA_ROLE="${{ inputs.robusta_role_arn }}"
          if [ -z "$ROBUSTA_ROLE" ]; then
            ROBUSTA_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/omnipulse-robusta-runner-${TARGET_ENV}"
          fi
          
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "alb_role_arn=$ALB_ROLE" >> $GITHUB_OUTPUT
          echo "robusta_role_arn=$ROBUSTA_ROLE" >> $GITHUB_OUTPUT
          echo "✅ Discovered Context: Cluster=$CLUSTER, VPC=$VPC_ID, ALB_Role=$ALB_ROLE"

      - name: Ensure Subnet Tags for AWS Load Balancer Controller
        run: |
          echo "==> Tagging VPC subnets with kubernetes.io/cluster/${{ steps.cluster-info.outputs.cluster_name }}=shared for ALB auto-discovery..."
          VPC_ID="${{ steps.cluster-info.outputs.vpc_id }}"
          CLUSTER="${{ steps.cluster-info.outputs.cluster_name }}"
          
          # Tag Public Subnets (required for internet-facing ALBs)
          PUBLIC_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --query "Subnets[?MapPublicIpOnLaunch==\`true\`].SubnetId" --output text)
          if [ -n "$PUBLIC_SUBNETS" ]; then
            echo "Tagging Public Subnets: $PUBLIC_SUBNETS"
            aws ec2 create-tags --resources $PUBLIC_SUBNETS --tags "Key=kubernetes.io/cluster/${CLUSTER},Value=shared" "Key=kubernetes.io/role/elb,Value=1"
          fi
          
          # Tag Private Subnets (for internal services / worker nodes)
          PRIVATE_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --query "Subnets[?MapPublicIpOnLaunch==\`false\`].SubnetId" --output text)
          if [ -n "$PRIVATE_SUBNETS" ]; then
            echo "Tagging Private Subnets: $PRIVATE_SUBNETS"
            aws ec2 create-tags --resources $PRIVATE_SUBNETS --tags "Key=kubernetes.io/cluster/${CLUSTER},Value=shared" "Key=kubernetes.io/role/internal-elb,Value=1"
          fi

          # Authorize VPC ingress on Cluster Security Group (for ALB to Pod IPs)
          SG_ID=$(aws eks describe-cluster --name "$CLUSTER" --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" --output text)
          VPC_CIDR=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" --query "Vpcs[0].CidrBlock" --output text)
          if [ -n "$SG_ID" ] && [ -n "$VPC_CIDR" ]; then
            aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol -1 --cidr "$VPC_CIDR" 2>/dev/null || true
            echo "✅ Security group $SG_ID authorized for VPC $VPC_CIDR"
          fi
          echo "✅ Subnet tags and security groups verified."

      - name: Purge Stale Webhook Configurations (Self-Healing TLS)
        run: |
          echo "==> Cleaning any stale webhook configurations to ensure clean CA certificate regeneration..."
          kubectl delete validatingwebhookconfiguration aws-load-balancer-webhook --ignore-not-found
          kubectl delete mutatingwebhookconfiguration aws-load-balancer-webhook --ignore-not-found
          kubectl -n kube-system delete secret aws-load-balancer-tls --ignore-not-found

      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName="${{ steps.cluster-info.outputs.cluster_name }}" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${{ steps.cluster-info.outputs.alb_role_arn }}" \
            --set vpcId="${{ steps.cluster-info.outputs.vpc_id }}"
          
          echo "==> Waiting for AWS Load Balancer Controller rollout..."
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=180s
          
          echo "==> Giving Kubernetes admission webhook controller 15s to propagate caBundle..."
          sleep 15

      - name: Install ExternalDNS for Automated Route 53 DNS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXT_DNS_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/omnipulse-external-dns-${TARGET_ENV}"
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update
          helm upgrade --install external-dns external-dns/external-dns \
            -n kube-system \
            --set provider.name=aws \
            --set env[0].name=AWS_DEFAULT_REGION \
            --set env[0].value="${AWS_REGION}" \
            --set domainFilters[0]="devopsstandard.name.ng" \
            --set policy=sync \
            --set txtOwnerId="omnipulse-${TARGET_ENV}" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=external-dns \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${EXT_DNS_ROLE}"
          kubectl rollout status deployment/external-dns -n kube-system --timeout=120s

      - name: Deploy Headlamp Cluster Dashboard
        run: |
          echo "==> Deploying Headlamp Dashboard (with webhook retry barrier)..."
          for i in {1..6}; do
            if kubectl apply -f k8s/headlamp/headlamp.yaml; then
              echo "✅ Headlamp deployed successfully!"
              break
            fi
            echo "⚠️ Webhook not ready yet, retrying in 10s (attempt $i/6)..."
            sleep 10
          done

      - name: Deploy Argo CD GitOps Engine
        run: |
          echo "==> Deploying Argo CD..."
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl -n argocd patch configmap argocd-cmd-params-cm --type merge -p '{"data":{"server.insecure":"true"}}' || true
          for i in {1..6}; do
            if kubectl apply -f k8s/argocd-ingress/argocd-ingress.yaml; then
              echo "✅ Argo CD Ingress deployed successfully!"
              break
            fi
            echo "⚠️ Webhook not ready yet, retrying in 10s (attempt $i/6)..."
            sleep 10
          done

      - name: Configure Argo CD Slack Notifications
        run: |
          SLACK_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}"
          SLACK_CH="${{ vars.SLACK_CHANNEL || 'operational-intelligence' }}"
          if [ -n "$SLACK_TOKEN" ]; then
            echo "==> Configuring Slack Bot token for Argo CD Notifications..."
            kubectl -n argocd create secret generic argocd-notifications-secret \
              --from-literal=slack-token="$SLACK_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
            
            kubectl -n argocd patch configmap argocd-notifications-cm --type merge -p "{
              \"data\": {
                \"service.slack\": \"token: \$slack-token\n\",
                \"subscriptions\": \"[{\\\"recipients\\\": [\\\"slack:${SLACK_CH}\\\"], \\\"triggers\\\": [\\\"on-sync-failed\\\", \\\"on-health-degraded\\\", \\\"on-sync-succeeded\\\"]}]\"
              }
            }" || true
            echo "✅ Argo CD Slack Notifications configured for #${SLACK_CH}"
          else
            echo "ℹ️ SLACK_BOT_TOKEN secret is not set. Skipping Argo CD Slack notification configuration."
          fi

      - name: Deploy Prometheus & Grafana Observability
        run: |
          echo "==> Deploying Prometheus & Grafana stack..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --set grafana.adminPassword="prom-operator"
          for i in {1..6}; do
            if kubectl apply -f k8s/grafana-ingress/grafana-ingress.yaml; then
              echo "✅ Grafana Ingress deployed successfully!"
              break
            fi
            echo "⚠️ Webhook not ready yet, retrying in 10s (attempt $i/6)..."
            sleep 10
          done

      - name: Deploy OmniPulse Microservices Fleet
        run: |
          echo "==> Deploying microservices fleet overlay: k8s/overlays/aws-${TARGET_ENV}"
          kubectl apply -k k8s/overlays/aws-${TARGET_ENV}

      - name: Deploy Robusta OSS AIOps Engine
        run: |
          echo "==> Deploying Robusta AIOps Engine..."
          helm repo add robusta https://robusta-charts.storage.googleapis.com
          helm repo update
          
          ROBUSTA_ARGS=(
            --namespace robusta --create-namespace
            -f k8s/robusta/values.yaml
            --set clusterName="${{ steps.cluster-info.outputs.cluster_name }}"
            --set globalConfig.cluster_name="${{ steps.cluster-info.outputs.cluster_name }}"
            --set runner.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${{ steps.cluster-info.outputs.robusta_role_arn }}"
          )
          
          SLACK_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}"
          SLACK_CH="${{ vars.SLACK_CHANNEL || 'operational-intelligence' }}"
          if [ -n "$SLACK_TOKEN" ]; then
            echo "✅ Injecting Slack Bot Token for Robusta ChatOps triage on #${SLACK_CH}..."
            ROBUSTA_ARGS+=(
              --set globalConfig.slack_api_key="$SLACK_TOKEN"
              --set globalConfig.slack_channel="$SLACK_CH"
              --set "sinksConfig[0].slack_sink.api_key=$SLACK_TOKEN"
              --set "sinksConfig[0].slack_sink.slack_channel=$SLACK_CH"
            )
          else
            echo "ℹ️ SLACK_BOT_TOKEN secret not set. Robusta will operate in local/in-cluster alert mode."
          fi
          
          helm upgrade --install robusta robusta/robusta "${ROBUSTA_ARGS[@]}"

      - name: Await AWS Application Load Balancer Hostnames
        run: |
          echo "==> Waiting up to 180s for AWS Load Balancer Controller to provision ALB hostnames..."
          for i in {1..36}; do
            ARGOCD_HOST=$(kubectl -n argocd get ingress argocd-server-aws-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            GRAFANA_HOST=$(kubectl -n monitoring get ingress grafana-aws-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            HEADLAMP_HOST=$(kubectl -n headlamp get ingress headlamp-aws-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            FRONTEND_HOST=$(kubectl -n omnipulse-aws-${TARGET_ENV} get ingress -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "$ARGOCD_HOST" ] && [ -n "$HEADLAMP_HOST" ] && [ -n "$GRAFANA_HOST" ]; then
              echo "✅ All AWS ALBs have been provisioned!"
              echo "ArgoCD:   $ARGOCD_HOST"
              echo "Grafana:  $GRAFANA_HOST"
              echo "Headlamp: $HEADLAMP_HOST"
              echo "Frontend: $FRONTEND_HOST"
              break
            fi
            echo "⏳ AWS ALB Controller is creating load balancers (attempt $i/36, waiting 5s)..."
            sleep 5
          done

          if [ -z "$ARGOCD_HOST" ] && [ -z "$HEADLAMP_HOST" ]; then
            echo "⚠️ Ingress hostnames not populated yet. Dumping Ingress events and ALB controller logs:"
            kubectl describe ingress -A || true
            kubectl -n kube-system logs -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50 || true
          fi

      - name: Export Headlamp Access Token
        run: |
          TOKEN=$(kubectl -n headlamp create token headlamp-admin --duration=24h 2>/dev/null || echo "")
          echo "$TOKEN" > headlamp-token.txt
          TOKEN_B64=$(echo -n "$TOKEN" | base64 -w 0 2>/dev/null || echo -n "$TOKEN" | base64)
          echo "token_b64=$TOKEN_B64" >> $GITHUB_ENV

      - name: Upload Headlamp Token Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headlamp-admin-token
          path: headlamp-token.txt
          retention-days: 1

      - name: Verify Live Endpoints
        run: |
          echo "==> Verifying live ALB health..."
          for host in "$HEADLAMP_HOST" "$ARGOCD_HOST" "$FRONTEND_HOST"; do
            if [ -n "$host" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "http://$host" || echo "timeout")
              echo "Probe: http://$host -> HTTP $STATUS"
            fi
          done

      - name: Generate Enterprise Platform Access Summary
        if: always()
        run: |
          echo "### 🚀 OmniPulse Platform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **${TARGET_ENV}** | Region: **${AWS_REGION}** | Cluster: **${{ steps.cluster-info.outputs.cluster_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 1. Fetch ArgoCD Credentials & Ingress
          ARGOCD_PW=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo "N/A (already rotated)")
          ARGOCD_HOST=$(kubectl -n argocd get ingress argocd-server-aws-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          [ -z "$ARGOCD_HOST" ] && ARGOCD_HOST="Provisioning ALB..."

          # 2. Fetch Grafana Ingress
          GRAFANA_HOST=$(kubectl -n monitoring get ingress grafana-aws-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          [ -z "$GRAFANA_HOST" ] && GRAFANA_HOST="Provisioning ALB..."

          # 3. Fetch Headlamp Ingress
          HEADLAMP_HOST=$(kubectl -n headlamp get ingress headlamp-aws-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          [ -z "$HEADLAMP_HOST" ] && HEADLAMP_HOST="Provisioning ALB..."

          # 4. Fetch Microservices Frontend Ingress
          FRONTEND_HOST=$(kubectl -n omnipulse-aws-${TARGET_ENV} get ingress -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          [ -z "$FRONTEND_HOST" ] && FRONTEND_HOST="Provisioning ALB..."

          # 5. Check Slack Alerting status
          if [ -n "${{ secrets.SLACK_BOT_TOKEN }}" ]; then
            SLACK_STATUS="✅ Active on #${{ vars.SLACK_CHANNEL || 'operational-intelligence' }}"
          else
            SLACK_STATUS="⚠️ Inactive (Set SLACK_BOT_TOKEN secret)"
          fi

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          | Service | Custom Domain (HTTPS) | ALB Hostname | Username | Initial Password / Auth Token |
          |:---|:---|:---|:---|:---|
          | **ArgoCD GitOps** | https://argocd.devopsstandard.name.ng | \`${ARGOCD_HOST}\` | \`admin\` | \`${ARGOCD_PW}\` |
          | **Grafana Dashboards** | https://grafana.devopsstandard.name.ng | \`${GRAFANA_HOST}\` | \`admin\` | \`prom-operator\` |
          | **Headlamp Kubernetes UI** | https://headlamp.devopsstandard.name.ng | \`${HEADLAMP_HOST}\` | ServiceAccount | *Download artifact or see below* |
          | **OmniPulse Microservices** | https://app.devopsstandard.name.ng | \`${FRONTEND_HOST}\` | *(Public)* | Open Access |
          | **Slack Incident ChatOps** | #${{ vars.SLACK_CHANNEL || 'operational-intelligence' }} | Bot User | ${SLACK_STATUS} |

          <details>
          <summary>🔑 <b>Click to Reveal Headlamp Token Retrieval & Terminal Commands</b></summary>

          #### Headlamp Bearer Token:
          * **Option A (Instant Download)**: Download the unmasked \`headlamp-admin-token\` file from the **Artifacts** section at the top of this run.
          * **Option B (Base64 Encoded - paste into terminal to decode)**:
          \`\`\`text
          ${token_b64}
          \`\`\`
          \`\`\`bash
          # Decode on macOS / Linux:
          echo "${token_b64}" | base64 -d

          # Decode in Windows PowerShell:
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${token_b64}"))
          \`\`\`

          #### Quick Terminal Retrieval:
          \`\`\`bash
          # Retrieve ArgoCD initial password from terminal:
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

          # Generate fresh Headlamp auth token:
          kubectl -n headlamp create token headlamp-admin --duration=24h
          \`\`\`

          </details>
          EOF
