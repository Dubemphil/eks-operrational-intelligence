apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s/overlays/aws-dev

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: app

images:
  - name: app
    newName: gcr.io/google-samples/microservices-demo/frontend
    newTag: v0.10.1
